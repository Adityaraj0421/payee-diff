[project]
name = "payee-diff"
version = "1.0.0"
description = "Report payment-detail differences between visible invoice text and hidden or raw text."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aditya Raj" }]
keywords = ["invoice", "iban", "pdf", "email"]
dependencies = [
  "beautifulsoup4>=4.12",
  "pdfminer.six>=20221105",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
payee-diff = "payee_diff.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
